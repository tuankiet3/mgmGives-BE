plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'pl.allegro.tech.build.axion-release' version '1.21.2'
}

group = 'com.mgmtp.gives'
description = 'mgm Gives - Charity Campaign Management System'

scmVersion {
    tag {
        prefix.set('v')
        versionSeparator.set('')
        initialVersion { config, position ->
            // The public history starts from a clean develop snapshot; avoid colliding with v3.2.0.
            '3.2.1'
        }
    }
    repository {
        remote.set('origin')
        pushTagsOnly.set(true)
        if (providers.environmentVariable('RELEASE_GIT_USER').isPresent()) {
            customUsername.set(providers.environmentVariable('RELEASE_GIT_USER').get())
        }
        if (providers.environmentVariable('RELEASE_GIT_TOKEN').isPresent()) {
            customPassword.set(providers.environmentVariable('RELEASE_GIT_TOKEN').get())
        }
    }
    useHighestVersion.set(true)
    versionCreator('versionWithCommitHash')
    releaseOnlyOnReleaseBranches = true
    releaseBranchNames = ['master', 'release/.*']
}

version = scmVersion.version
def ciVersion = version.toString()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    archUnitVersion = '1.4.2'
    jacocoMinimumLineCoverage = 0.31
    jjwtVersion = '0.12.6'
    mapstructVersion = '1.6.3'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    implementation 'com.googlecode.owasp-java-html-sanitizer:owasp-java-html-sanitizer:20240325.1'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'org.apache.commons:commons-csv:1.10.0'
    implementation 'vn.payos:payos-java:2.0.1'
    implementation 'com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.flywaydb:flyway-core'
    testImplementation 'org.flywaydb:flyway-database-postgresql'
    testImplementation "com.tngtech.archunit:archunit:${archUnitVersion}"
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-parameters']
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', System.getProperty('spring.profiles.active', 'test')
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = true
        csv.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('jacocoTestReport')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = jacocoMinimumLineCoverage
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.register('printVersion') {
    group = 'versioning'
    description = 'Prints only the Axion-derived project version for CI scripts.'
    doLast {
        println ciVersion
    }
}

tasks.named('bootBuildImage') {
    builder = 'paketobuildpacks/ubuntu-noble-builder'
    environment['BP_JVM_VERSION'] = '21'
}
