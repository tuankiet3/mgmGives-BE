name: mgm-gives

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mgmgives
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"

  be:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8080:8080"
