<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Final Report</title>
    <style>
        @page {
            size: A4;
            margin: 2.2cm 2cm;
        }
        body {
            font-family: 'Noto Sans', 'Helvetica', 'Arial', sans-serif;
            color: #1f2937;
            font-size: 12px;
            line-height: 1.6;
        }
        h1 {
            font-size: 22px;
            color: #111827;
            margin: 0 0 4px;
        }
        .subtitle {
            color: #6b7280;
            font-size: 11px;
            margin-bottom: 20px;
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 22px;
        }
        .stats-table td {
            width: 20%;
            padding: 12px 10px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        .stats-value {
            font-size: 17px;
            font-weight: bold;
            color: #111827;
            display: block;
        }
        .stats-label {
            font-size: 10px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        h2.section-title {
            font-size: 15px;
            color: #111827;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 6px;
            margin: 22px 0 10px;
        }
        .content-block p {
            margin: 0 0 10px;
        }
        .content-block ul, .content-block ol {
            margin: 0 0 10px;
            padding-left: 18px;
        }
        .footer {
            margin-top: 30px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
            color: #9ca3af;
            font-size: 10px;
        }
        .cover-image-wrap {
            width: 100%;
            height: 220px;
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 18px;
            background-color: #f3f4f6;
        }
        .cover-image-wrap img {
            width: 100%;
            height: 100%;
        }
        .spending-stats {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 14px;
        }
        .spending-stats td {
            width: 50%;
            padding: 12px 10px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        .spending-row {
            width: 100%;
            padding-bottom: 12px;
            margin-bottom: 12px;
            border-bottom: 1px solid #e5e7eb;
            page-break-inside: avoid;
            break-inside: avoid;
        }
        .spending-row::after {
            content: "";
            display: block;
            clear: both;
        }
        .spending-photo {
            float: left;
            width: 220px;
            margin-right: 16px;
        }
        .spending-photo img {
            width: 220px;
            border-radius: 4px;
            border: 1px solid #e5e7eb;
            display: block;
        }
        .spending-info {
            padding-top: 2px;
        }
        .spending-desc {
            color: #1f2937;
        }
        .spending-meta {
            color: #6b7280;
            font-size: 10px;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="cover-image-wrap" th:if="${coverImageUrl != null}">
    <img th:src="${coverImageUrl}" alt="Campaign cover"/>
</div>

<h1 th:text="${campaignName}">Campaign Name</h1>
<div class="subtitle">
    Final Report
    <th:block th:if="${publishedAt != null}"> &#183; Published <span th:text="${publishedAt}"></span></th:block>
    <th:block th:if="${publishedByName != null}"> by <span th:text="${publishedByName}"></span></th:block>
</div>

<table class="stats-table">
    <tr>
        <td>
            <span class="stats-value" th:text="${totalRaised} + ' VND'">0 VND</span>
            <span class="stats-label">Total Raised</span>
        </td>
        <td>
            <span class="stats-value" th:text="${goalPercent} + '%'">0%</span>
            <span class="stats-label">Of Goal</span>
        </td>
        <td>
            <span class="stats-value" th:text="${donorCount}">0</span>
            <span class="stats-label">Donors</span>
        </td>
        <td>
            <span class="stats-value" th:text="${volunteerCount}">0</span>
            <span class="stats-label">Volunteers</span>
        </td>
        <td th:if="${taskCount != null and taskCount &gt; 0}">
            <span class="stats-value" th:text="${completedTaskCount} + '/' + ${taskCount}">0/0</span>
            <span class="stats-label">Tasks Completed</span>
        </td>
    </tr>
</table>

<div th:if="${resultSummary != null and !#strings.isEmpty(resultSummary)}">
    <h2 class="section-title">Summary</h2>
    <div class="content-block" th:utext="${resultSummary}"></div>
</div>

<div th:if="${itemsSummary != null and !#strings.isEmpty(itemsSummary)}">
    <h2 class="section-title">Goods &amp; Items</h2>
    <div class="content-block"><p th:text="${itemsSummary}"></p></div>
</div>

<div th:if="${acknowledgements != null and !#strings.isEmpty(acknowledgements)}">
    <h2 class="section-title">Acknowledgements</h2>
    <div class="content-block"><p th:text="${acknowledgements}"></p></div>
</div>

<div th:if="${taskSummary != null and !#strings.isEmpty(taskSummary)}">
    <h2 class="section-title">Task &amp; Volunteer Work</h2>
    <div class="content-block"><p th:text="${taskSummary}"></p></div>
</div>

<div th:if="${spendingItems != null and !spendingItems.isEmpty()}">
    <h2 class="section-title">Fund Usage</h2>
    <table class="spending-stats">
        <tr>
            <td>
                <span class="stats-value" th:text="${totalSpent} + ' VND'">0 VND</span>
                <span class="stats-label">Total Spent</span>
            </td>
            <td>
                <span class="stats-value" th:text="${remainingFunds} + ' VND'">0 VND</span>
                <span class="stats-label">Remaining Funds</span>
            </td>
        </tr>
    </table>
    <div th:each="item : ${spendingItemsWithPhoto}" class="spending-row">
        <div class="spending-photo">
            <img th:src="${item.photoUrl}" alt="Spending photo"/>
        </div>
        <div class="spending-info">
            <div class="spending-desc" th:text="${item.description}"></div>
            <div class="spending-meta">
                <span th:text="${item.spentAt}"></span> &#183; <span th:text="${item.amount} + ' VND'"></span>
            </div>
        </div>
    </div>
</div>

<div class="footer">
    Generated by mgmGives &#183; <span th:text="${reportLink}"></span>
</div>

</body>
</html>
