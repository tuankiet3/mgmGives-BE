<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Final Report</title>
    <style>
        @page {
            size: A4;
            margin: 2.2cm 2cm;
        }
        body {
            font-family: 'Noto Sans', 'Helvetica', 'Arial', sans-serif;
            color: #1f2937;
            font-size: 12px;
            line-height: 1.6;
        }
        h1 {
            font-size: 22px;
            color: #111827;
            margin: 0 0 4px;
        }
        .subtitle {
            color: #6b7280;
            font-size: 11px;
            margin-bottom: 20px;
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 22px;
        }
        .stats-table td {
            width: 25%;
            padding: 12px 10px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }
        .stats-value {
            font-size: 17px;
            font-weight: bold;
            color: #111827;
            display: block;
        }
        .stats-label {
            font-size: 10px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        h2.section-title {
            font-size: 15px;
            color: #111827;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 6px;
            margin: 22px 0 10px;
        }
        .content-block p {
            margin: 0 0 10px;
        }
        .content-block ul, .content-block ol {
            margin: 0 0 10px;
            padding-left: 18px;
        }
        .footer {
            margin-top: 30px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
            color: #9ca3af;
            font-size: 10px;
        }
        .gallery {
            width: 100%;
        }
        .gallery::after {
            content: "";
            display: block;
            clear: both;
        }
        .gallery-item {
            float: left;
            width: 31.33%;
            margin: 0 1% 12px;
            height: 110px;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            overflow: hidden;
            background-color: #f3f4f6;
        }
        .gallery-item img {
            width: 100%;
            height: 100%;
        }
        .gallery-item.video-placeholder {
            display: block;
            text-align: center;
            color: #6b7280;
            font-size: 10px;
            padding-top: 44px;
        }
    </style>
</head>
<body>

<h1 th:text="${campaignName}">Campaign Name</h1>
<div class="subtitle">
    Final Report
    <th:block th:if="${publishedAt != null}"> &#183; Published <span th:text="${publishedAt}"></span></th:block>
    <th:block th:if="${publishedByName != null}"> by <span th:text="${publishedByName}"></span></th:block>
</div>

<table class="stats-table">
    <tr>
        <td>
            <span class="stats-value" th:text="${totalRaised} + ' VND'">0 VND</span>
            <span class="stats-label">Total Raised</span>
        </td>
        <td>
            <span class="stats-value" th:text="${goalPercent} + '%'">0%</span>
            <span class="stats-label">Of Goal</span>
        </td>
        <td>
            <span class="stats-value" th:text="${donorCount}">0</span>
            <span class="stats-label">Donors</span>
        </td>
        <td>
            <span class="stats-value" th:text="${volunteerCount}">0</span>
            <span class="stats-label">Volunteers</span>
        </td>
    </tr>
</table>

<div th:if="${resultSummary != null and !#strings.isEmpty(resultSummary)}">
    <h2 class="section-title">Summary</h2>
    <div class="content-block" th:utext="${resultSummary}"></div>
</div>

<div th:if="${itemsSummary != null and !#strings.isEmpty(itemsSummary)}">
    <h2 class="section-title">Goods &amp; Items</h2>
    <div class="content-block"><p th:text="${itemsSummary}"></p></div>
</div>

<div th:if="${acknowledgements != null and !#strings.isEmpty(acknowledgements)}">
    <h2 class="section-title">Acknowledgements</h2>
    <div class="content-block"><p th:text="${acknowledgements}"></p></div>
</div>

<div th:if="${galleryMedia != null and !galleryMedia.isEmpty()}">
    <h2 class="section-title">Moments from the field</h2>
    <div class="gallery">
        <div th:each="media : ${galleryMedia}"
             th:class="${media.video} ? 'gallery-item video-placeholder' : 'gallery-item'">
            <img th:if="${!media.video}" th:src="${media.url}" alt="Campaign moment"/>
            <span th:if="${media.video}">Video attachment &#8212; view online</span>
        </div>
    </div>
</div>

<div class="footer">
    Generated by mgmGives &#183; <span th:text="${reportLink}"></span>
</div>

</body>
</html>
