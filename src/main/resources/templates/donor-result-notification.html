<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div style="font-family:sans-serif;max-width:560px;margin:0 auto;padding:32px 24px;">

    <h2 style="color:#1f2937;">
        Campaign Results Are In!
    </h2>

    <p>
        Hi <strong th:text="${fullName}"></strong>,
    </p>

    <p>
        The final results for the campaign
        <strong>"<span th:text="${campaignName}"></span>"</strong>
        are now available!
    </p>

    <p th:if="${!#strings.isEmpty(aiMessage)}"
       style="white-space:pre-line;"
       th:text="${aiMessage}">
    </p>

    <p th:if="${#strings.isEmpty(aiMessage)}">
        <th:block th:if="${!#strings.isEmpty(formattedAmount)}">
            Thank you for your generous donation of
            <strong>
                <span th:text="${formattedAmount}"></span> VND
            </strong>.
        </th:block>
        <th:block th:if="${#strings.isEmpty(formattedAmount)}">
            Thank you for your generous contribution.
        </th:block>
        Together, we made it happen!
    </p>

</div>

</body>
</html>
